name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --all-targets --all-features

  web-checks:
    name: Web Frontend Checks & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Check Formatting
        run: pnpm --dir apps/web format:check

      - name: Biome Linter Check
        run: pnpm --dir apps/web lint

      - name: Typecheck TypeScript
        run: pnpm --dir apps/web typecheck

      - name: Build Web SPA
        run: pnpm --dir apps/web build

  mobile-checks:
    name: Mobile App Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/mobile install --frozen-lockfile

      - name: Check Formatting
        run: pnpm --dir apps/mobile format:check

      - name: Biome Linter Check
        run: pnpm --dir apps/mobile lint

      - name: Typecheck TypeScript
        run: pnpm --dir apps/mobile typecheck

      - name: Run Unit Tests
        run: pnpm --dir apps/mobile test

      - name: Expo Doctor Check
        run: pnpm --dir apps/mobile run doctor

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [rust-checks, web-checks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: tnotes-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
