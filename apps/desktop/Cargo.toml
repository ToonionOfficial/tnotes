[package]
name = "tnotes-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
tnotes-core = { path = "../../crates/tnotes-core" }
tnotes-document = { path = "../../crates/tnotes-document" }

gpui = "0.2"
twrite = { version = "0.10.1", features = ["markdown"] }
rust-embed = "8.5"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
gpui = { version = "0.2", features = ["test-support"] }
