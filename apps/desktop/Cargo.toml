[package]
name = "tnotes-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
tnotes-core = { path = "../../crates/tnotes-core" }

gpui = "0.2"
twrite = { version = "0.10.0", features = ["markdown"] }
rust-embed = "8.5"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
gpui = { version = "0.2", features = ["test-support"] }
