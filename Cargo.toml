[workspace]
members = ["crates/tnotes-core", "apps/server", "apps/desktop", "crates/tnotes-document"]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.2"
edition = "2024"
authors = ["Toonion"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ToonionOfficial/tnotes"

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
