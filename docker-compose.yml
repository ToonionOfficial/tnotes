services:
  notat-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8787:8787"
    volumes:
      - notat-data:/data
    environment:
      - NOTAT_DATA_DIR=/data
      - NOTAT_HOST=0.0.0.0
      - NOTAT_PORT=8787
      - RUST_LOG=notat_server=info,tower_http=info

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - notat-server

volumes:
  notat-data:
  caddy-data:
  caddy-config:
