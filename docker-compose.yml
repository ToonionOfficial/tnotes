services:
  tnotes-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8787:8787"
    volumes:
      - tnotes-data:/data
    environment:
      - TNOTES_DATA_DIR=/data
      - TNOTES_HOST=0.0.0.0
      - TNOTES_PORT=8787
      - RUST_LOG=tnotes_server=info,tnotes_server=info,tower_http=info

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - tnotes-server

volumes:
  tnotes-data:
  caddy-data:
  caddy-config:
